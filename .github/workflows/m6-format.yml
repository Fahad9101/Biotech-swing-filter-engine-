name: M6 branch formatter

on:
  push:
    branches: [milestone-6-market-technicals]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-6-market-technicals
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply canonical Ruff format
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format tests/test_milestone6.py
      - name: Commit formatted test
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_milestone6.py
          git commit -m "style: canonicalize Milestone 6 test formatting"
          git push origin HEAD:milestone-6-market-technicals
