name: M7 build promotion ledger

on:
  push:
    branches: [milestone-7-historical-validation]
    paths:
      - ".github/workflows/m7-build-promotion-ledger.yml"
      - "scripts/m7_build_promotion_ledger.py"
      - "scripts/m7_select_promotion_worklist.py"
      - "validation/m7/acquisition/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build promotion ledger
        run: python scripts/m7_build_promotion_ledger.py
      - name: Build promotion worklist
        run: python scripts/m7_select_promotion_worklist.py
      - name: Commit promotion artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/m7/promotion/candidate-promotion-ledger.json validation/m7/promotion/promotion-worklist-01.json
          if git diff --cached --quiet; then
            echo "Promotion artifacts unchanged"
            exit 0
          fi
          git commit -m "M7: build prefreeze promotion artifacts"
          git pull --rebase origin milestone-7-historical-validation
          git push origin HEAD:milestone-7-historical-validation
