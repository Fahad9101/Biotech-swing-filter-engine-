name: M7 regulatory CIK repair

on:
  push:
    branches: [milestone-7-historical-validation]
    paths:
      - ".github/workflows/m7-reg-cik-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply verified CIK mappings and canonicalize
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("validation/m7/acquisition/regulatory-primary-batch-01.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          mappings = {
              "REG-2018-AGIO-TIBSOVO": "0001439222",
              "REG-2019-GBT-OXBRYTA": "0001629137",
              "REG-2020-RYTM-IMCIVREE": "0001649904",
              "REG-2021-ASND-SKYTROFA": "0001612042",
              "REG-2022-MRNS-ZTALMY": "0001267813",
              "REG-2022-AMLX-RELYVRIO": "0001658551",
              "REG-2023-TVTX-FILSPARI": "0001438533",
          }
          for event in payload["events"]:
              candidate_id = event["candidate_id"]
              if candidate_id in mappings:
                  event["cik"] = mappings[candidate_id]
                  event["promotion_blockers"] = [
                      blocker
                      for blocker in event["promotion_blockers"]
                      if blocker != "RESOLVE_CIK_AND_HISTORICAL_SECURITY_IDENTITY"
                  ]
          payload["cik_resolved_count"] = sum(
              event["cik"] is not None for event in payload["events"]
          )
          payload["exact_timestamp_count"] = sum(
              event["first_public_timestamp"] is not None for event in payload["events"]
          )
          payload["date_only_count"] = sum(
              event["first_public_timestamp"] is None for event in payload["events"]
          )
          payload.pop("registry_sha256", None)
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          payload["registry_sha256"] = hashlib.sha256(canonical.encode()).hexdigest()
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "cik_resolved_count": payload["cik_resolved_count"],
              "registry_sha256": payload["registry_sha256"],
          }, sort_keys=True))
          PY
      - name: Commit verified identities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/m7/acquisition/regulatory-primary-batch-01.json
          if git diff --cached --quiet; then
            echo "No CIK changes"
            exit 0
          fi
          git commit -m "M7: apply verified regulatory CIK identities"
          git pull --rebase origin milestone-7-historical-validation
          git push origin HEAD:milestone-7-historical-validation
