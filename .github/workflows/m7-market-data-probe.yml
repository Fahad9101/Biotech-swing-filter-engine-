name: M7 market-data probe

on:
  push:
    branches: [milestone-7-historical-validation]
    paths:
      - ".github/workflows/m7-market-data-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe Nasdaq historical bars around NVDA split
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/142 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.nasdaq.com/",
          }

          def fetch(symbol, start, end):
              params = urllib.parse.urlencode({
                  "assetclass": "stocks" if symbol != "XBI" else "etf",
                  "fromdate": start,
                  "todate": end,
                  "limit": 5000,
              })
              url = f"https://api.nasdaq.com/api/quote/{symbol}/historical?{params}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              rows = (((payload.get("data") or {}).get("tradesTable") or {}).get("rows") or [])
              print(symbol, json.dumps(rows[:20], sort_keys=True))

          fetch("NVDA", "2024-06-05", "2024-06-12")
          fetch("XBI", "2024-06-05", "2024-06-12")
          PY
