name: M4 type repair

on:
  push:
    branches: [milestone-4-financial-survival]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-4-financial-survival
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repair strict typing and validate style
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/boe/financials.py')
          text = path.read_text()
          text = text.replace(
              'from __future__ import annotations\n\nfrom datetime import date, datetime',
              'from __future__ import annotations\n\nfrom collections.abc import Iterable\nfrom datetime import date, datetime',
          )
          old = '''def _unique_uuid(values: object) -> tuple[UUID, ...]:\n    result: list[UUID] = []\n    seen: set[UUID] = set()\n    for value in values:  # type: ignore[union-attr]\n        if not isinstance(value, UUID):\n            raise TypeError("expected UUID lineage value")\n        if value not in seen:\n            seen.add(value)\n            result.append(value)\n    return tuple(result)'''
          new = '''def _unique_uuid(values: Iterable[UUID]) -> tuple[UUID, ...]:\n    result: list[UUID] = []\n    seen: set[UUID] = set()\n    for value in values:\n        if value not in seen:\n            seen.add(value)\n            result.append(value)\n    return tuple(result)'''
          if old not in text:
              raise SystemExit('financials helper fragment not found')
          path.write_text(text.replace(old, new))

          path = Path('src/boe/ingestion/sec_financials.py')
          text = path.read_text()
          text = text.replace('from typing import Any', 'from typing import Any, Literal')
          text = text.replace(
              '        kind: str | None = None',
              '        kind: Literal["ATM", "SHELF", "OFFERING"] | None = None',
          )
          text = text.replace(
              '        amounts = [_money_decimal(match) for match in _MONEY_RE.finditer(sentence)]\n        amounts = [value for value in amounts if value is not None]',
              '        amounts = [\n            value\n            for match in _MONEY_RE.finditer(sentence)\n            if (value := _money_decimal(match)) is not None\n        ]',
          )
          text = text.replace(
              '        category: str',
              '        category: Literal[\n            "SHELF", "PROSPECTUS_SUPPLEMENT", "OTHER_FINANCING_FILING"\n        ]',
          )
          path.write_text(text)

          path = Path('src/boe/repositories/financials.py')
          text = path.read_text()
          text = text.replace(
              'from sqlalchemy.orm import Mapped, mapped_column',
              'from pydantic import BaseModel\nfrom sqlalchemy.orm import Mapped, mapped_column',
          )
          old = '''def _json(value: object) -> str:\n    if hasattr(value, "model_dump"):\n        payload = value.model_dump(mode="json")  # type: ignore[attr-defined]\n    elif isinstance(value, tuple):\n        payload = [\n            item.model_dump(mode="json") if hasattr(item, "model_dump") else str(item)\n            for item in value\n        ]\n    else:\n        payload = value\n    return json.dumps(payload, sort_keys=True, separators=(",", ":"), default=str)'''
          new = '''def _json(value: object) -> str:\n    payload: object\n    if isinstance(value, BaseModel):\n        payload = value.model_dump(mode="json")\n    elif isinstance(value, tuple):\n        payload = [\n            item.model_dump(mode="json") if isinstance(item, BaseModel) else str(item)\n            for item in value\n        ]\n    else:\n        payload = value\n    return json.dumps(payload, sort_keys=True, separators=(",", ":"), default=str)'''
          if old not in text:
              raise SystemExit('repository json fragment not found')
          path.write_text(text.replace(old, new))
          PY
          python -m pip install "ruff>=0.12,<1"
          ruff format .
          ruff check .
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/boe/financials.py src/boe/ingestion/sec_financials.py src/boe/repositories/financials.py
          git commit -m "fix: satisfy strict Milestone 4 typing"
          git push origin HEAD:milestone-4-financial-survival
