name: M7 ClinicalTrials candidate enrichment

on:
  push:
    branches: [milestone-7-historical-validation]
    paths:
      - "scripts/m7_enrich_clinical_candidates.py"
      - ".github/workflows/m7-clinical-candidate-enrichment.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install BOE and Ruff
        run: |
          python -m pip install -e .
          python -m pip install "ruff>=0.12,<1"
      - name: Validate enrichment script
        run: |
          ruff format --check scripts/m7_enrich_clinical_candidates.py
          ruff check scripts/m7_enrich_clinical_candidates.py
      - name: Enrich clinical candidates from ClinicalTrials.gov
        run: python scripts/m7_enrich_clinical_candidates.py
      - name: Commit discovery artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/m7/discovery/clinicaltrials-official-candidates.json
          git add validation/m7/discovery/clinicaltrials-official-candidates-summary.json
          if git diff --cached --quiet; then
            echo "No ClinicalTrials acquisition artifact changes"
          else
            git commit -m "M7: enrich clinical event candidates from ClinicalTrials.gov"
            git pull --rebase origin milestone-7-historical-validation
            git push origin HEAD:milestone-7-historical-validation
          fi
