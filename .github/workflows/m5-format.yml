name: M5 branch formatter

on:
  push:
    branches: [milestone-5-science-pos-rnpv-scoring]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-5-science-pos-rnpv-scoring
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply canonical Ruff format
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format .
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests migrations
          git commit -m "style: format Milestone 5 implementation"
          git push origin HEAD:milestone-5-science-pos-rnpv-scoring
