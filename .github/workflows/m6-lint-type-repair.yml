name: M6 lint type repair

on:
  push:
    branches: [milestone-6-market-technicals]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-6-market-technicals
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repair lint and strict typing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/boe/ingestion/market.py')
          text = path.read_text()
          text = text.replace(
              'from datetime import UTC, datetime',
              'from datetime import UTC, date, datetime',
          )
          text = text.replace(
              '            "Milestone 6 uses operator-supplied bulk history only; BOE performs no automated download.",',
              '            (\n                "Milestone 6 uses operator-supplied bulk history only; BOE performs "\n                "no automated download."\n            ),',
          )
          text = text.replace(
              '            "BOE assumes no commercial rights; the operator must obtain the snapshot under applicable terms.",',
              '            (\n                "BOE assumes no commercial rights; the operator must obtain the snapshot "\n                "under applicable terms."\n            ),',
          )
          text = text.replace(
              '            "Commercial production remains blocked pending an explicitly licensed market-data source.",',
              '            (\n                "Commercial production remains blocked pending an explicitly licensed "\n                "market-data source."\n            ),',
          )
          text = text.replace(
              '            "Historical point-in-time use requires an archived snapshot from the relevant cutoff date.",',
              '            (\n                "Historical point-in-time use requires an archived snapshot from the "\n                "relevant cutoff date."\n            ),',
          )
          text = text.replace(
              'def _parse_date(value: str):\n    from datetime import date\n\n',
              'def _parse_date(value: str) -> date:\n',
          )
          path.write_text(text)

          path = Path('src/boe/technicals.py')
          text = path.read_text()
          text = text.replace(
              'from typing import Self\n',
              'from typing import Self\nfrom uuid import UUID\n',
          )
          text = text.replace(
              '            "Validated support = highest eligible SMA20, SMA50, or explicitly validated pivot below close.",',
              '            (\n                "Validated support = highest eligible SMA20, SMA50, or explicitly "\n                "validated pivot below close."\n            ),',
          )
          text = text.replace(
              '    evidence_id,\n',
              '    evidence_id: UUID,\n',
              1,
          )
          text = text.replace(
              'zip(gains[period:], losses[period:])',
              'zip(gains[period:], losses[period:], strict=True)',
          )
          text = text.replace(
              'zip(bars, bars[1:])',
              'zip(bars, bars[1:], strict=False)',
          )
          path.write_text(text)

          path = Path('tests/test_milestone6.py')
          text = path.read_text()
          text = text.replace(
              'zip(gains[14:], losses[14:])',
              'zip(gains[14:], losses[14:], strict=True)',
          )
          text = text.replace(
              'zip(window, window[1:])',
              'zip(window, window[1:], strict=False)',
          )
          text = text.replace(
              'zip(xs, obv_values)',
              'zip(xs, obv_values, strict=True)',
          )
          path.write_text(text)
          PY
          python -m pip install -e ".[dev]"
          ruff format .
          ruff check .
          mypy src
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: repair Milestone 6 lint and typing"
          git push origin HEAD:milestone-6-market-technicals
