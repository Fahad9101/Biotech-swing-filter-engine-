name: M7 source probe

on:
  push:
    branches: [milestone-7-historical-validation]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe CTO linkage and human-label metadata
        run: |
          python - <<'PY'
          import json, urllib.request, csv, io

          api_base = 'https://huggingface.co/api/datasets/chufangao/CTO/tree/main/'
          for folder in ['Merged_all_trial_linkage_outcome_df__FDA_updated', 'human_labels_2020_2024']:
              url = api_base + folder + '?recursive=true&expand=false'
              with urllib.request.urlopen(url, timeout=60) as response:
                  items = json.load(response)
              print('\nFOLDER', folder)
              for item in items[:100]:
                  print(item.get('path'), item.get('size'))

          resolve = 'https://huggingface.co/datasets/chufangao/CTO/resolve/main/'
          candidates = [
              'human_labels_2020_2024/human_labels.csv',
              'human_labels_2020_2024/human_labels_2020_2024.csv',
              'Merged_all_trial_linkage_outcome_df__FDA_updated/Merged_all_trial_linkage_outcome_df__FDA_updated.csv',
          ]
          for path in candidates:
              try:
                  with urllib.request.urlopen(resolve + path, timeout=60) as response:
                      text = response.read().decode('utf-8-sig')
              except Exception as exc:
                  print('MISS', path, type(exc).__name__, str(exc)[:200])
                  continue
              reader = csv.DictReader(io.StringIO(text))
              rows = []
              for i, row in enumerate(reader):
                  rows.append(row)
                  if i >= 4:
                      break
              print('\nFILE', path)
              print('COLUMNS', json.dumps(reader.fieldnames))
              print('SAMPLE', json.dumps(rows, default=str)[:16000])
          PY
