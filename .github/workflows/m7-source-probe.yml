name: M7 source probe

on:
  push:
    branches: [milestone-7-historical-validation]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe public CTO candidate-discovery mappings
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, collections

          base = 'https://huggingface.co/datasets/chufangao/CTO/resolve/main/'
          url = base + 'labels_and_tickers/labels_and_tickers.csv'
          with urllib.request.urlopen(url, timeout=60) as response:
              text = response.read().decode('utf-8-sig')
          reader = csv.DictReader(io.StringIO(text))
          rows = list(reader)
          print('COLUMNS', json.dumps(reader.fieldnames))
          print('ROWS', len(rows))
          print('SAMPLE', json.dumps(rows[:8], default=str)[:12000])
          for field in reader.fieldnames or []:
              nonempty = sum(bool((row.get(field) or '').strip()) for row in rows)
              print('NONEMPTY', field, nonempty)
          for candidate in ('phase', 'trial_phase', 'ticker', 'tickers', 'completion_date', 'start_date', 'nct_id'):
              if candidate in (reader.fieldnames or []):
                  values = collections.Counter((row.get(candidate) or '').strip() for row in rows)
                  print('TOP', candidate, values.most_common(15))
          PY
