name: M7 primary-source acquisition

on:
  push:
    branches: [milestone-7-historical-validation]
    paths:
      - "scripts/m7_acquire_sec_candidates.py"
      - ".github/workflows/m7-primary-source-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install BOE
        run: python -m pip install -e .
      - name: Ruff-check acquisition script
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format --check scripts/m7_acquire_sec_candidates.py
          ruff check scripts/m7_acquire_sec_candidates.py
      - name: Acquire SEC primary-source candidates
        env:
          BOE_SEC_USER_AGENT: >-
            BOE-M7 historical-validation research
            https://github.com/Fahad9101/Biotech-swing-filter-engine-
        run: python scripts/m7_acquire_sec_candidates.py
      - name: Inspect discovery summary
        run: cat validation/m7/discovery/sec-primary-candidates-summary.json
      - name: Commit discovery artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/m7/discovery/sec-primary-candidates.json
          git add validation/m7/discovery/sec-primary-candidates-summary.json
          if git diff --cached --quiet; then
            echo "No acquisition artifact changes"
          else
            git commit -m "M7: acquire SEC primary-source event candidates"
            git push origin HEAD:milestone-7-historical-validation
          fi
