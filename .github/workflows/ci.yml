name: BOE quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: boe-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy src

      - name: Test package
        run: pytest

      - name: Exercise database migration
        run: BOE_DATABASE_URL=sqlite+pysqlite:///ci-migration.db alembic upgrade head

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Exercise offline contract CLI
        run: boe-contracts --candidate tests/fixtures/valid_candidate.json
