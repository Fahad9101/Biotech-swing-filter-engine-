name: M7 regulatory batch hash repair

on:
  push:
    branches: [milestone-7-historical-validation]
    paths:
      - ".github/workflows/m7-reg-batch-hash-repair.yml"
      - "validation/m7/acquisition/regulatory-primary-batch-01.json"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Recompute canonical registry hash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("validation/m7/acquisition/regulatory-primary-batch-01.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload.pop("registry_sha256", None)
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          payload["registry_sha256"] = hashlib.sha256(canonical.encode()).hexdigest()
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(payload["registry_sha256"])
          PY
      - name: Commit repair if needed
        run: |
          if git diff --quiet -- validation/m7/acquisition/regulatory-primary-batch-01.json; then
            echo "Registry hash already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/m7/acquisition/regulatory-primary-batch-01.json
          git commit -m "M7: canonicalize regulatory acquisition hash"
          git pull --rebase origin milestone-7-historical-validation
          git push origin HEAD:milestone-7-historical-validation
