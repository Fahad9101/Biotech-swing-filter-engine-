name: M4 branch repair

on:
  push:
    branches: [milestone-4-financial-survival]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-4-financial-survival
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repair trace strings and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/boe/financials.py')
          text = path.read_text()
          replacements = {
              'formula="liquidity = unrestricted_cash + current_marketable_securities; debt uses aggregate debt when available, otherwise current + noncurrent debt",': 'formula=(\n            "liquidity = unrestricted_cash + current_marketable_securities; "\n            "debt uses aggregate debt when available, otherwise current + noncurrent debt"\n        ),',
              'formula="normalized quarterly burn = median(latest four comparable negative operating cash-flow quarters); with <3 quarters use max(latest burn, available-quarter median)",': 'formula=(\n            "normalized quarterly burn = median(latest four comparable negative operating "\n            "cash-flow quarters); with <3 quarters use max(latest burn, available-quarter median)"\n        ),',
              'formula="current fully diluted shares = basic + options + warrants + RSUs + convertible shares + other dilutive shares; projected fully diluted shares additionally include expected financing shares",': 'formula=(\n            "current fully diluted shares = basic + options + warrants + RSUs + convertible "\n            "shares + other dilutive shares; projected fully diluted shares additionally "\n            "include expected financing shares"\n        ),',
              'formula="runway_months = (cash + current marketable securities) / normalized_quarterly_burn * 3; runway_at_catalyst = max(runway_months - calendar_days_to_latest_catalyst/30.4375, 0)",': 'formula=(\n            "runway_months = (cash + current marketable securities) / normalized_quarterly_burn "\n            "* 3; runway_at_catalyst = max(runway_months - "\n            "calendar_days_to_latest_catalyst/30.4375, 0)"\n        ),',
              'formula="Milestone 4 exposes atomic financing-risk inputs only; modeled dilution percent = expected financing shares / current fully diluted shares * 100",': 'formula=(\n            "Milestone 4 exposes atomic financing-risk inputs only; modeled dilution percent = "\n            "expected financing shares / current fully diluted shares * 100"\n        ),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old[:60]}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          python -m pip install "ruff>=0.12,<1"
          ruff format .
          ruff check .
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/boe/financials.py
          git commit -m "style: wrap Milestone 4 calculation traces"
          git push origin HEAD:milestone-4-financial-survival
