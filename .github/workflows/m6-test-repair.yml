name: M6 test repair

on:
  push:
    branches: [milestone-6-market-technicals]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-6-market-technicals
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repair independent recomputation field mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_milestone6.py')
          text = path.read_text()
          old = '        actual = getattr(snapshot, key)\n'
          new = (
              '        snapshot_key = (\n'
              '            "benchmark_return_20d_pct" if key == "xbi_return_20d_pct" else key\n'
              '        )\n'
              '        actual = getattr(snapshot, snapshot_key)\n'
          )
          if old not in text:
              raise SystemExit('target test line not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m pip install -e ".[dev]"
          ruff format .
          ruff check .
          mypy src
          pytest
      - name: Commit repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_milestone6.py
          git commit -m "fix: reconcile M6 benchmark golden field"
          git push origin HEAD:milestone-6-market-technicals
