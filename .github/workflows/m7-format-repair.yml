name: M7 format repair

on:
  push:
    branches: [milestone-7-historical-validation]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-7-historical-validation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Canonical format and validate
        run: |
          python -m pip install -e ".[dev]"
          ruff format .
          ruff check .
          mypy src
          pytest
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations src tests
          git commit -m "fix: format and validate Milestone 7"
          git push origin HEAD:milestone-7-historical-validation
