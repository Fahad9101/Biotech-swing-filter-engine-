name: M4 branch formatter

on:
  push:
    branches: [milestone-4-financial-survival]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-4-financial-survival
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format branch
        run: ruff format .
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format Milestone 4 files"
          git push origin HEAD:milestone-4-financial-survival
