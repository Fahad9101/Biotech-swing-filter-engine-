name: M7 FDA regulatory acquisition

on:
  push:
    branches: [milestone-7-historical-validation]
    paths:
      - "scripts/m7_acquire_fda_regulatory.py"
      - ".github/workflows/m7-fda-regulatory-acquisition.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install BOE and Ruff
        run: |
          python -m pip install -e .
          python -m pip install "ruff>=0.12,<1"
      - name: Validate acquisition script
        run: |
          ruff format --check scripts/m7_acquire_fda_regulatory.py
          ruff check scripts/m7_acquire_fda_regulatory.py
      - name: Acquire official FDA regulatory candidates
        run: python scripts/m7_acquire_fda_regulatory.py
      - name: Commit discovery artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/m7/discovery/fda-regulatory-candidates.json
          git add validation/m7/discovery/fda-regulatory-candidates-summary.json
          if git diff --cached --quiet; then
            echo "No FDA acquisition artifact changes"
          else
            git commit -m "M7: acquire FDA regulatory event candidates"
            git pull --rebase origin milestone-7-historical-validation
            git push origin HEAD:milestone-7-historical-validation
          fi
